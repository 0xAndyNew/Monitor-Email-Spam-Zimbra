# ==============================================================================
# SENDER & DOMAIN WHITELIST
# File location on server: /etc/zimbra-spam-monitor/whitelist.conf
#
# Accounts or domains listed here will NOT trigger spam alerts and will NOT be
# automatically locked when sending high-volume legitimate emails.
#
# Format: One email address (or @domain.com) per line.
# Lines starting with '#' are comments.
# ==============================================================================

# Examples:
# marketing@yourdomain.com
# newsletter@yourdomain.com
# noreply@yourdomain.com
