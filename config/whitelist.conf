# ==============================================================================
# DANH SÁCH TÀI KHOẢN / TÊN MIỀN MIỄN TRỪ (WHITELIST)
# Vị trí file trên server: /etc/zimbra-spam-monitor/whitelist.conf
#
# Các địa chỉ email hoặc tên miền nằm trong danh sách này sẽ KHÔNG bị cảnh báo
# và KHÔNG bị tự động khóa khi gửi số lượng lớn email (ví dụ: email marketing,
# thông báo nhân sự, hệ thống tự động).
#
# Mỗi dòng 1 địa chỉ email (hoặc @domain.com để miễn trừ cả domain).
# Dòng bắt đầu bằng dấu # là dòng ghi chú.
# ==============================================================================

# Ví dụ:
# marketing@yourdomain.com
# newsletter@yourdomain.com
# noreply@yourdomain.com
