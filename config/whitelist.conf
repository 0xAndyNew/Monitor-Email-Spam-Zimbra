# ==============================================================================
# SENDER & DOMAIN WHITELIST + PER-ACCOUNT CUSTOM LIMITS
# File location on server: /etc/zimbra-spam-monitor/whitelist.conf
#
# Supported formats (1 entry per line; '#' starts a comment):
#
# 1) FULL BYPASS (exempt from all spam alerts & auto-locking):
#      noreply@yourdomain.com
#      @trusted-partner.com
#
# 2) PER-ACCOUNT / PER-DOMAIN CUSTOM LIMITS (RECOMMENDED over blind bypass):
#    Format: <email or @domain> <WARN_RECIPIENTS_5M> <CRIT_RECIPIENTS_5M>
#    Overrides volume limits while STILL protecting against spoofing, Amavis
#    malware/spam, multi-IP botnet, and abnormal failure spikes!
#      marketing@yourdomain.com 500 1000
#      newsletter@yourdomain.com 300 600
# ==============================================================================

# Examples:
# marketing@yourdomain.com 500 1000
# newsletter@yourdomain.com 300 600
# noreply@yourdomain.com
