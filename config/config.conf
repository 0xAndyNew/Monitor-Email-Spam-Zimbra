# ==============================================================================
# ZIMBRA OUTBOUND SPAM MONITOR CONFIGURATION (zimbra-spam-monitor)
# File location on server: /etc/zimbra-spam-monitor/config.conf
#
# USAGE:
# - Run interactive control panel:
#     zimbra-spam-monitor
# - Or test alert delivery directly:
#     zimbra-spam-monitor --test
# - Changes take effect immediately on the next check cycle.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. GENERAL SETTINGS & ZIMBRA LOG PATH
# ------------------------------------------------------------------------------
# Enable or disable monitoring ("true" or "false")
MONITOR_ENABLED="true"

# Path to Zimbra mail log file
ZIMBRA_LOG_FILE="/var/log/zimbra.log"

# Maximum number of trailing lines to scan from /var/log/zimbra.log per run
# (Protects CPU/RAM/Disk IO when log files grow to multiple GBs)
LOG_TAIL_LINES=200000

# Count internal-to-internal emails?
# - "false" (Recommended): Only count outbound external emails and SASL-authenticated traffic
# - "true": Count all emails including internal-to-internal messages
COUNT_INTERNAL_TO_INTERNAL="false"

# Internal Zimbra domains (space-separated)
# - "auto": Auto-detect from Zimbra configuration / server hostname
# - Or specify manually: "example.com sub.example.com"
INTERNAL_DOMAINS="auto"

# ------------------------------------------------------------------------------
# 2. SPAM DETECTION THRESHOLDS (SHORT WINDOW, HOURLY, AND POSTFIX QUEUE)
# ------------------------------------------------------------------------------

# [A] SHORT-WINDOW THRESHOLD (Minutes - catches rapid burst spam attacks)
LOOKBACK_MINUTES=10
WARN_SENT_PER_WINDOW=80
CRIT_SENT_PER_WINDOW=200

# [B] HOURLY THRESHOLD (60 Minutes - catches slow/distributed spam)
ENABLE_HOURLY_CHECK="true"
WARN_SENT_PER_HOUR=300
CRIT_SENT_PER_HOUR=600

# [C] POSTFIX QUEUE THRESHOLD (Instant queue inspection via postqueue)
WARN_QUEUE_PER_USER=40
CRIT_QUEUE_PER_USER=100
WARN_TOTAL_QUEUE=300

# ------------------------------------------------------------------------------
# 3. AUTOMATIC REMEDIATION ON CRITICAL THRESHOLD
# ------------------------------------------------------------------------------
# Automatically lock account (zmprov ma <email> zimbraAccountStatus locked) on CRITICAL
AUTO_LOCK_ON_CRITICAL="true"

# Automatically place queued messages of CRITICAL spammer on hold (postsuper -h)
AUTO_HOLD_QUEUE_ON_CRITICAL="false"

# ------------------------------------------------------------------------------
# 4. TELEGRAM NOTIFICATION SETTINGS
# ------------------------------------------------------------------------------
TELEGRAM_ENABLED="true"
TELEGRAM_BOT_TOKEN=""
TELEGRAM_CHAT_ID=""

# ------------------------------------------------------------------------------
# 5. EMAIL & SMTP NOTIFICATION SETTINGS
# ------------------------------------------------------------------------------
EMAIL_ENABLED="true"

# Delivery mode:
# - "auto"  (Recommended): Use Zimbra local Postfix; fallback to external SMTP if queue is congested or local send fails
# - "local" : Only use Zimbra local Postfix sendmail (no SMTP credentials needed)
# - "smtp"  : Only use external SMTP server configured below
EMAIL_DELIVERY_MODE="auto"

# Recipient email address(es) for alerts:
# - "auto": Auto-detect Zimbra admin address (smtp_destination)
# - Or comma-separated addresses: "admin@example.com,secops@gmail.com"
ALERT_EMAIL_TO="auto"

# Sender email address (From):
# - "auto": Auto-detect Zimbra system sender (smtp_source / zimbra-monitor@domain)
ALERT_EMAIL_FROM="auto"

# [OPTIONAL] External fallback SMTP settings (leave empty if using local Zimbra Postfix only)
SMTP_HOST=""
SMTP_PORT="587"
SMTP_USER=""
SMTP_PASS=""
SMTP_TLS="true"

# ------------------------------------------------------------------------------
# 6. ALERT COOLDOWN & STATE PATHS
# ------------------------------------------------------------------------------
# Cooldown time (minutes) before repeating the same alert level for the same user
# (Escalation from WARNING to CRITICAL always alerts immediately)
ALERT_COOLDOWN_MINUTES=30

WHITELIST_FILE="/etc/zimbra-spam-monitor/whitelist.conf"
STATE_DIR="/var/lib/zimbra-spam-monitor"
MONITOR_LOG_FILE="/var/log/zimbra-spam-monitor.log"
