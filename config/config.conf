# ==============================================================================
# ZIMBRA OUTBOUND SPAM MONITOR CONFIGURATION (zimbra-spam-monitor v1.3.2)
# File location on server: /etc/zimbra-spam-monitor/config.conf
#
# SAFETY GUARANTEE:
# - Strictly READ-ONLY with respect to Mail Server & OS configuration.
# - NEVER modifies Postfix, Zimbra global/server config, firewall, or OS packages.
#
# USAGE:
# - Open interactive control panel : zimbra-spam-monitor
# - Send test alert                : zimbra-spam-monitor --test
# - Check server IP RBL (read-only): zimbra-spam-monitor --check-rbl
# - Security posture audit (RO)    : zimbra-spam-monitor --audit
# - Changes take effect immediately on the next check cycle.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. GENERAL SETTINGS & LOG PATHS (SINGLE-SERVER ZIMBRA READY)
# ------------------------------------------------------------------------------
# Enable or disable monitoring ("true" or "false")
MONITOR_ENABLED="true"

# Displayed server IP in alerts and status (cached 24h in server_ip.cache):
# - "auto" (Recommended): Resolve IPv4 from DNS of the server hostname (ignores LAN IP behind NAT)
# - Or specify a fixed IP manually: "203.0.113.10"
SERVER_IP="auto"

# Primary Zimbra Postfix/Amavis log file
ZIMBRA_LOG_FILE="/var/log/zimbra.log"

# Single-server auxiliary Zimbra logs (read-only, auto-skipped if absent):
# - mailbox.log: Extracts real client IP (oip=) for Webmail/SOAP/ActiveSync senders
# - audit.log  : Detects brute-force & login-after-repeated-failures compromise signals
ZIMBRA_MAILBOX_LOG_FILE="/opt/zimbra/log/mailbox.log"
ZIMBRA_AUDIT_LOG_FILE="/opt/zimbra/log/audit.log"

# Maximum trailing lines to scan from /var/log/zimbra.log per run
# (Auto-expands up to LOG_MAX_TAIL_LINES only during severe spam storms)
LOG_TAIL_LINES=200000
LOG_MAX_TAIL_LINES=500000

# Maximum trailing lines to pre-filter from mailbox.log and audit.log
AUX_LOG_TAIL_LINES=50000

# Count benign internal-to-internal emails?
# - "false" (Recommended): Only count outbound external mail & SASL traffic
#   (Note: Internal Amavis SPAM/INFECTED/BANNED & spoofing are ALWAYS detected!)
# - "true": Count all emails including internal-to-internal messages
COUNT_INTERNAL_TO_INTERNAL="false"

# Internal Zimbra domains (space-separated):
# - "auto" (Recommended): Auto-detect hosted domains via read-only ldapsearch (cached 24h, zero JVM)
# - Or specify manually: "example.com sub.example.com"
INTERNAL_DOMAINS="auto"
AUTO_DISCOVER_ZIMBRA_DOMAINS="true"

# Optional extra trusted internal submission IPs (space-separated, e.g. separate mailbox node IP)
TRUSTED_SUBMISSION_IPS=""

# ------------------------------------------------------------------------------
# 2. CHECK TIME RANGE, COOLDOWN & FLOOD PROTECTION
# ------------------------------------------------------------------------------
# Short burst log time range (minutes)
LOOKBACK_MINUTES=5

# Cooldown time (minutes) before repeating the same alert level for 1 user
# (Escalation from WARNING to CRITICAL or RE-LOCK always alerts immediately)
ALERT_COOLDOWN_MINUTES=30

# Cap detailed individual alerts per cycle (extras are batched into 1 summary to avoid Telegram 429)
MAX_ALERTS_PER_CYCLE=8

# ------------------------------------------------------------------------------
# 3. SHORT-WINDOW SPAM THRESHOLDS (PER LOOKBACK_MINUTES)
# ------------------------------------------------------------------------------

# [A] VOLUME THRESHOLDS: Messages Sent, Total Recipients, Unique Recipients
WARN_MESSAGES_SENT=60
CRIT_MESSAGES_SENT=150

WARN_RECIPIENTS=100
CRIT_RECIPIENTS=200
# Minimum distinct messages required to trigger CRITICAL on recipient counts
# (Prevents 1 single legitimate CC/BCC company announcement from auto-locking user)
CRIT_MIN_MESSAGES_FOR_BULK=10

WARN_UNIQUE_RECIPIENTS=80
CRIT_UNIQUE_RECIPIENTS=160
MIN_EXTERNAL_DOMAINS_FOR_UNIQUE=5

# [B] FAILED RATE THRESHOLDS: (Deferred + Bounced + Expired) / Recipients * 100%
MIN_RECIPIENTS_FOR_FAIL_RATE=20
WARN_FAILED_RATE_PCT=30
CRIT_MIN_RECIPIENTS_FOR_FAIL_RATE=40
CRIT_FAILED_RATE_PCT=50

# [C] BOTNET SOURCE IPs & EXTERNAL SENDER SPOOFING
# Count mode:
# - "subnet" (Recommended): Count distinct /24 IPv4 (or /64 IPv6) networks (prevents mobile 4G false locks)
# - "exact" : Count distinct individual IP addresses
SOURCE_IP_COUNT_MODE="subnet"
WARN_SOURCE_IPS=3
WARN_MIN_MESSAGES_FOR_IPS=10
CRIT_SOURCE_IPS=5
CRIT_MIN_MESSAGES_FOR_IPS=20

WARN_SPOOF_COUNT=3
CRIT_SPOOF_COUNT=10

# [D] CONTENT SPAM (AMAVIS SPAM/INFECTED/BANNED & REMOTE RBL/SPAM REJECTS)
AMAVIS_SPAM_SCORE_THRESHOLD="6.0"
WARN_SPAM_SIGNALS=3
CRIT_SPAM_SIGNALS=10

# [E] POSTFIX MAIL QUEUE THRESHOLDS (Live Active + Deferred; excludes Held '!' mail)
WARN_QUEUE_PER_USER=40
CRIT_QUEUE_PER_USER=100
WARN_TOTAL_QUEUE=300

# ------------------------------------------------------------------------------
# 4. MULTI-WINDOW LOW-AND-SLOW, BRUTE-FORCE & COMPOSITE RISK SCORE
# ------------------------------------------------------------------------------
# Rolling 1-hour & 24-hour limits (idempotent 5-min submission buckets, never double-counted)
# Note: 24h limits trigger WARNING only to protect high-volume ERP/noreply accounts.
WARN_HOURLY_MESSAGES=300
CRIT_HOURLY_MESSAGES=600
WARN_HOURLY_RECIPIENTS=500
CRIT_HOURLY_RECIPIENTS=1000
WARN_DAILY_MESSAGES=1500
WARN_DAILY_RECIPIENTS=2500

# Auth brute-force & compromise early-warning (audit.log + Postfix SASL failures)
# Never auto-locks victim accounts on failed logins alone (prevents DoS).
WARN_AUTH_FAIL_PER_IP=50
AUTH_FAIL_BEFORE_SUCCESS_MIN=5
AUTH_ALERT_COOLDOWN_MINUTES=60

# Local postfix/pickup external-From webshell detection threshold (alert only)
WARN_PICKUP_EXTERNAL_MESSAGES=20

# Composite Risk Score (0-100): catches evasive spammers staying just under multiple thresholds
RISK_SCORE_ENABLED="true"
WARN_RISK_SCORE=60
CRIT_RISK_SCORE=85

# ------------------------------------------------------------------------------
# 5. SINGLE-ACCOUNT AUTOMATIC REMEDIATION ON CRITICAL
# ------------------------------------------------------------------------------
# Automatically lock confirmed CRITICAL account (zmprov ma <email> zimbraAccountStatus locked)
AUTO_LOCK_ON_CRITICAL="true"

# Immediately flush auth cache of ONLY the locked account (zmprov fc account <email>)
# Stops active Webmail/SOAP/ActiveSync tokens right away without affecting other users.
FLUSH_CACHE_ON_LOCK="true"

# Grace window (seconds) after lock before fresh traffic triggers RE-LOCK / desync cleanup
LOCK_RELOCK_GRACE_SECONDS=120

# Automatically place queued messages of CRITICAL spammer on hold (postsuper -h)
# Default "false" for maximum safety; enable in Menu [4] if desired.
AUTO_HOLD_QUEUE_ON_CRITICAL="false"

# Safety circuit breaker: max new accounts auto-locked in a single scan cycle (0 = unlimited).
# Prevents mass false-locking & JVM spikes during ISP/DNS outages (alerts still fire for all).
MAX_LOCKS_PER_CYCLE=5

# Optional space/comma-separated accounts or @domains protected from auto-lock (alert only).
# Note: Zimbra system accounts (spam.*, ham.*, virus-quarantine.*, galsync.*) are always protected.
PROTECTED_ACCOUNTS=""

# Safety timeouts (seconds) for zmprov and postqueue invocations
ZMPROV_TIMEOUT_SECONDS=120
POSTQUEUE_TIMEOUT_SECONDS=30

# ------------------------------------------------------------------------------
# 6. TELEGRAM NOTIFICATION SETTINGS
# ------------------------------------------------------------------------------
TELEGRAM_ENABLED="true"
TELEGRAM_BOT_TOKEN=""
TELEGRAM_CHAT_ID=""

# ------------------------------------------------------------------------------
# 7. EMAIL & SMTP NOTIFICATION SETTINGS
# ------------------------------------------------------------------------------
EMAIL_ENABLED="true"
# Delivery mode: "auto" (Local Postfix w/ SMTP fallback), "local", or "smtp"
EMAIL_DELIVERY_MODE="auto"
ALERT_EMAIL_TO="auto"
ALERT_EMAIL_FROM="auto"

# [OPTIONAL] External fallback SMTP settings
SMTP_HOST=""
SMTP_PORT="587"
SMTP_USER=""
SMTP_PASS=""
SMTP_TLS="true"

# ------------------------------------------------------------------------------
# 8. WEBHOOK NOTIFICATIONS (SLACK / DISCORD / GENERIC JSON)
# ------------------------------------------------------------------------------
WEBHOOK_ENABLED="false"
WEBHOOK_URL=""
WEBHOOK_FORMAT="generic"

# ------------------------------------------------------------------------------
# 9. SELF-RBL BLACKLIST MONITOR, HEALTH CHECK & OPTIONAL DAILY DIGEST
# ------------------------------------------------------------------------------
# Periodically check server IP against active DNSBLs (read-only DNS, alerts only on state change)
RBL_CHECK_ENABLED="true"
RBL_CHECK_INTERVAL_MINUTES=60
# Leave empty to check resolved SERVER_IP, or list space-separated outbound IPv4s
RBL_CHECK_IPS=""
RBL_PROVIDERS="zen.spamhaus.org bl.spamcop.net bl.mailspike.net dnsbl-1.uceprotect.net psbl.surriel.com"

# Alert if /var/log/zimbra.log is missing or has not been updated for LOG_STALE_MINUTES
HEALTH_CHECK_ENABLED="true"
LOG_STALE_MINUTES=30
HEALTH_ALERT_COOLDOWN_MINUTES=360

# Optional daily traffic digest (disabled by default)
DAILY_SUMMARY_ENABLED="false"
DAILY_SUMMARY_HOUR="08"

# ------------------------------------------------------------------------------
# 10. STATE & LOG PATHS
# ------------------------------------------------------------------------------
WHITELIST_FILE="/etc/zimbra-spam-monitor/whitelist.conf"
STATE_DIR="/var/lib/zimbra-spam-monitor"
MONITOR_LOG_FILE="/var/log/zimbra-spam-monitor.log"
JSON_LOG_ENABLED="true"
JSON_LOG_FILE="/var/log/zimbra-spam-monitor-events.jsonl"
