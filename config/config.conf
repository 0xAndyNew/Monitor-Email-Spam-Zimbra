# ==============================================================================
# CẤU HÌNH HỆ THỐNG GIÁM SÁT EMAIL SPAM ZIMBRA (zimbra-spam-monitor)
# Vị trí file trên server: /etc/zimbra-spam-monitor/config.conf
#
# HƯỚNG DẪN:
# - Anh có thể chỉnh sửa trực tiếp file này bằng lệnh:
#     nano /etc/zimbra-spam-monitor/config.conf
#   Hoặc chạy menu cấu hình tương tác:
#     zimbra-spam-monitor --configure
# - Mọi thay đổi trong file này có hiệu lực NGAY LẬP TỨC ở lần quét kế tiếp.
# - Sau khi sửa xong, chạy lệnh sau để gửi thử thông báo kiểm tra:
#     zimbra-spam-monitor --test
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. TRẠNG THÁI HOẠT ĐỘNG & ĐƯỜNG DẪN LOG ZIMBRA
# ------------------------------------------------------------------------------
# Bật/tắt toàn bộ hệ thống giám sát ("true" hoặc "false")
MONITOR_ENABLED="true"

# Đường dẫn file log của Zimbra
ZIMBRA_LOG_FILE="/var/log/zimbra.log"

# Số dòng cuối tối đa đọc từ /var/log/zimbra.log mỗi lần quét
# (Giúp bảo vệ CPU/RAM tuyệt đối khi file log cuối ngày nặng hàng GB)
LOG_TAIL_LINES=100000

# Chỉ đếm email gửi ra miền ngoài (Internet) hay đếm cả email gửi nội bộ?
# - "false" (Khuyên dùng): Chỉ đếm email gửi ra ngoài (Gmail, Yahoo, đối tác...)
#   hoặc khi phát hiện đăng nhập SASL gửi hàng loạt.
# - "true": Đếm tất cả email bao gồm cả gửi nội bộ trong cùng công ty.
COUNT_INTERNAL_TO_INTERNAL="false"

# Danh sách domain nội bộ của hệ thống Zimbra
# - Để "auto": Tự động nhận diện từ hệ thống Zimbra (hostname / domain mặc định)
# - Hoặc điền tay cách nhau bởi khoảng trắng: "congty.com.vn chinhanh.com.vn"
INTERNAL_DOMAINS="auto"

# ------------------------------------------------------------------------------
# 2. CẤU HÌNH NGƯỠNG CẢNH BÁO SPAM (THEO PHÚT, THEO GIỜ & HÀNG ĐỢI QUEUE)
# ------------------------------------------------------------------------------

# [A] NGƯỠNG THEO CỬA SỐ PHÚT (Bắt tài khoản bị hack bắn spam bùng phát nhanh)
# Khoảng thời gian quét ngắn (Đơn vị: Phút - Ví dụ: 5, 10, 15 phút)
LOOKBACK_MINUTES=10

# Số lượng email gửi đi trong khoảng LOOKBACK_MINUTES phút để báo WARNING (Cảnh báo)
WARN_SENT_PER_WINDOW=80

# Số lượng email gửi đi trong khoảng LOOKBACK_MINUTES phút để báo CRITICAL (Nguy hiểm -> Khóa)
CRIT_SENT_PER_WINDOW=200

# [B] NGƯỠNG THEO GIỜ - 60 PHÚT (Bắt spam rải rác / nhỏ giọt kéo dài)
ENABLE_HOURLY_CHECK="true"

# Số lượng email gửi đi trong 1 giờ (60 phút) để báo WARNING
WARN_SENT_PER_HOUR=300

# Số lượng email gửi đi trong 1 giờ (60 phút) để báo CRITICAL
CRIT_SENT_PER_HOUR=600

# [C] NGƯỠNG HÀNG ĐỢI POSTFIX TỨC THỜI (mailq / postqueue)
# Số lượng email của 1 tài khoản đang nằm kẹt trong Queue để báo WARNING
WARN_QUEUE_PER_USER=40

# Số lượng email của 1 tài khoản đang nằm kẹt trong Queue để báo CRITICAL
CRIT_QUEUE_PER_USER=100

# Tổng số lượng email của toàn bộ Server trong Queue để cảnh báo nghẽn hệ thống
WARN_TOTAL_QUEUE=300

# ------------------------------------------------------------------------------
# 3. HÀNH ĐỘNG TỰ ĐỘNG KHI TÀI KHOẢN VƯỢT NGƯỠNG CRITICAL
# ------------------------------------------------------------------------------
# Tự động khóa tài khoản (zmprov ma <email> zimbraAccountStatus locked) khi chạm mức CRITICAL
# - "true": Tự động khóa và báo trong tin nhắn Telegram/Email
# - "false": Chỉ gửi cảnh báo, không tự khóa tài khoản
AUTO_LOCK_ON_CRITICAL="true"

# Tự động tạm giữ (postsuper -h) các email đang chờ trong Queue của tài khoản bị CRITICAL
# để ngăn không cho Postfix tiếp tục gửi số mail spam đó ra ngoài
AUTO_HOLD_QUEUE_ON_CRITICAL="false"

# ------------------------------------------------------------------------------
# 4. CẤU HÌNH THÔNG BÁO QUA TELEGRAM
# ------------------------------------------------------------------------------
TELEGRAM_ENABLED="true"

# Token của Bot Telegram (Lấy từ @BotFather, ví dụ: "123456789:AAHxyz...")
TELEGRAM_BOT_TOKEN=""

# Chat ID của cá nhân hoặc Nhóm nhận cảnh báo (Ví dụ: "-100123456789" hoặc "987654321")
TELEGRAM_CHAT_ID=""

# ------------------------------------------------------------------------------
# 5. CẤU HÌNH THÔNG BÁO QUA EMAIL
# ------------------------------------------------------------------------------
EMAIL_ENABLED="true"

# Phương thức gửi Email cảnh báo:
# - "auto"  (Khuyên dùng): Tự động dùng Postfix nội bộ của Zimbra; nếu có cấu hình SMTP
#           ngoài bên dưới và hàng đợi nội bộ đang nghẽn thì tự động chuyển qua SMTP ngoài.
# - "local" : Chỉ gửi trực tiếp qua Postfix nội bộ của Zimbra (Không cần tài khoản SMTP).
# - "smtp"  : Chỉ gửi qua máy chủ SMTP bên ngoài cấu hình bên dưới.
EMAIL_DELIVERY_MODE="auto"

# Địa chỉ Email NHẬN cảnh báo:
# - Để "auto": Tự động lấy email Admin mặc định của hệ thống Zimbra (smtp_destination)
# - Hoặc điền trực tiếp (nhiều email cách nhau bằng dấu phẩy): "admin@congty.com,it@gmail.com"
ALERT_EMAIL_TO="auto"

# Địa chỉ Email GỬI cảnh báo (From):
# - Để "auto": Tự động lấy địa chỉ gửi của hệ thống Zimbra (smtp_source / zimbra-monitor@domain)
ALERT_EMAIL_FROM="auto"

# [TÙY CHỌN DỰ PHÒNG] Cấu hình SMTP bên ngoài (Bỏ trống nếu chỉ dùng email hệ thống Zimbra)
SMTP_HOST=""
SMTP_PORT="587"
SMTP_USER=""
SMTP_PASS=""
SMTP_TLS="true"

# ------------------------------------------------------------------------------
# 6. THỜI GIAN CHỐNG LẶP CẢNH BÁO (COOLDOWN) & LOG
# ------------------------------------------------------------------------------
# Thời gian nghỉ (Phút) giữa 2 lần gửi cảnh báo cùng mức độ cho cùng 1 tài khoản
# (Nếu tài khoản tăng từ WARNING lên CRITICAL thì sẽ báo và xử lý ngay lập tức)
ALERT_COOLDOWN_MINUTES=30

# File danh sách miễn trừ (Whitelist) và thư mục lưu trạng thái
WHITELIST_FILE="/etc/zimbra-spam-monitor/whitelist.conf"
STATE_DIR="/var/lib/zimbra-spam-monitor"
MONITOR_LOG_FILE="/var/log/zimbra-spam-monitor.log"
